<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Коралловый риф: Заказы моря</title>
    <!-- Площадка: Одноклассники. SDK площадки и переходник вместо Яндекс SDK. -->
    <script src="https://api.ok.ru/js/fapi5.js"></script>
    <script src="./platform-bridge.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        background: #0a5a8a;
      }
      #sea {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        background: linear-gradient(180deg, #1ec8d8 0%, #0a5a8a 100%);
      }
      .sea-rays {
        position: absolute;
        left: -30%;
        right: -30%;
        top: 0;
        height: 70%;
        -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
        mask-image: linear-gradient(180deg, #000 0%, transparent 100%);
        will-change: transform;
        animation: sea-sway 14s ease-in-out infinite alternate;
      }
      @keyframes sea-sway {
        from {
          transform: translate3d(-40px, 0, 0);
        }
        to {
          transform: translate3d(40px, 0, 0);
        }
      }
      .sea-floor {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 220px;
        background-repeat: repeat-x;
        background-position: center bottom;
        background-size: 720px 220px;
      }
      .sea-bubbles {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: -256px;
        background-repeat: repeat;
        background-size: 256px 256px;
        will-change: transform;
        animation: sea-rise 20s linear infinite;
      }
      @keyframes sea-rise {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(0, -256px, 0);
        }
      }
      .lowfx .sea-bubbles,
      .lowfx .sea-rays {
        animation: none;
        will-change: auto;
      }
      .lowfx .sea-bubbles + .sea-bubbles {
        display: none;
      }
      #game {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-B9pdTkyY.js"></script>
  </head>
  <body oncontextmenu="return false;">
    <div id="game"></div>
  </body>
</html>
